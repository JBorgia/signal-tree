name: Retired node memory characterization

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Historical characterization/validation or current sensitivity validation
        type: choice
        required: true
        default: characterization
        options:
          - characterization
          - validation
          - sensitivity

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Create evidence directory
        run: mkdir -p artifacts/retention-characterization

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Frozen dependency install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee artifacts/retention-characterization/install.log

      - name: Build kernel explicitly without Nx cache
        run: |
          set -o pipefail
          pnpm exec nx build kernel --skip-nx-cache 2>&1 | tee artifacts/retention-characterization/build.log

      - name: Collect historical preregistered raw fresh-process batch
        if: inputs.phase != 'sensitivity'
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          set -o pipefail
          case "$PHASE" in
            characterization) mode=() ;;
            validation) mode=(--validation) ;;
            *) echo "Unknown diagnostic phase: $PHASE"; exit 1 ;;
          esac
          node tools/characterize-retired-node-memory.mjs "${mode[@]}" --out artifacts/retention-characterization/data 2>&1 | tee artifacts/retention-characterization/driver.log

      - name: Validate current artifact sensitivity with eighteen fresh children
        if: inputs.phase == 'sensitivity'
        run: |
          set -o pipefail
          node tools/check-retired-lifetime-gross-retention.mjs --check-helpers 2>&1 | tee artifacts/retention-characterization/helpers.log
          for repetition in 1 2 3; do
            node tools/check-retired-lifetime-gross-retention.mjs --self-test 2>&1 | tee "artifacts/retention-characterization/sensitivity-$repetition.jsonl"
          done
          node tools/check-retired-lifetime-gross-retention.mjs 2>&1 | tee artifacts/retention-characterization/lookup-normal.jsonl
          node tools/check-retired-lifetime-gross-retention.mjs --arm no-history-node-reads 2>&1 | tee artifacts/retention-characterization/node-normal.jsonl
          node tools/check-retired-lifetime-cleanup.mjs --self-test 2>&1 | tee artifacts/retention-characterization/cleanup-self.log

      - name: Upload raw evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retired-node-memory-${{ inputs.phase }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/retention-characterization/
          if-no-files-found: warn
