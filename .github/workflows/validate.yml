name: Validate

# Runs the full gate set (§5 rule 3): lint, typecheck, tests, builds, and the
# doc-truth verifiers (taught symbols + version claims) on every PR and every
# push to main. Previously no CI ran these gates at all.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, typecheck, test, build, verify
    runs-on: ubuntu-24.04
    container:
      # Official Playwright 1.56.1 Noble image, pinned to the supported browser dependencies.
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-tags` + full depth: release-claims diffs the public API
          # against the last STABLE version tag. A shallow, tagless checkout made
          # it exit 1 with "No prior version tag found" — a CI-only failure that
          # passed on every laptop, which is the worst shape a gate failure can
          # have.
          fetch-depth: 0
          fetch-tags: true

      - name: Trust the mounted candidate checkout for container Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for packed Angular AOT gate
        run: |
          node -e 'require("node:assert/strict").equal(require("playwright/package.json").version, "1.56.1")'
          pnpm exec playwright install chromium

      # The gates read dist/ — barrels, bundle budgets, foldability, tarball
      # contents. `gates` verifies a build; it does not produce one.
      - name: Build all packages
        run: pnpm run build:all

      - name: All gates (lint budget, typecheck, tests, barrels, exports, docs, budgets, harnesses)
        run: pnpm run gates

      - name: Prove every gate can still fail
        run: pnpm run gates:self-test

      - name: Rebuild clean artifacts after mutation proofs
        run: |
          git diff --exit-code
          rm -rf dist/packages
          pnpm exec nx run-many -t build --projects=kernel,angular,react,vue,solid --configuration=production --skip-nx-cache


  demo-route-smoke:
    name: Demo route smoke (Playwright)
    runs-on: ubuntu-24.04
    container:
      # Official Playwright 1.56.1 Noble image, pinned to the supported browser dependencies.
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-tags` + full depth: release-claims diffs the public API
          # against the last STABLE version tag. A shallow, tagless checkout made
          # it exit 1 with "No prior version tag found" — a CI-only failure that
          # passed on every laptop, which is the worst shape a gate failure can
          # have.
          fetch-depth: 0
          fetch-tags: true

      - name: Trust the mounted candidate checkout for container Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build demo (production)
        run: pnpm exec nx build demo --configuration=production

      - name: Install Playwright chromium
        run: |
          node -e 'require("node:assert/strict").equal(require("playwright/package.json").version, "1.56.1")'
          pnpm exec playwright install chromium

      - name: Route smoke (8 key routes, no console errors, visible h1/main)
        run: pnpm run smoke:routes
