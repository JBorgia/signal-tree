name: Validate

# Runs the full gate set (§5 rule 3): lint, typecheck, tests, builds, and the
# doc-truth verifiers (taught symbols + version claims) on every PR and every
# push to main. Previously no CI ran these gates at all.

on:
  # Manual runs include release-only checks but never tag or publish.
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, typecheck, test, build, verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-tags` + full depth: release-claims diffs the public API
          # against the last STABLE version tag. A shallow, tagless checkout made
          # it exit 1 with "No prior version tag found" — a CI-only failure that
          # passed on every laptop, which is the worst shape a gate failure can
          # have.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for packed Angular AOT gate
        run: pnpm exec playwright install --with-deps chromium

      # The gates read dist/ — barrels, bundle budgets, foldability, tarball
      # contents. `gates` verifies a build; it does not produce one.
      - name: Build all packages
        run: pnpm run build:all

      - name: All gates (lint budget, typecheck, tests, barrels, exports, docs, budgets, harnesses)
        env:
          RELEASE_CHECKS: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$RELEASE_CHECKS" = "true" ]; then
            pnpm run gates -- --release
          else
            pnpm run gates
          fi

      - name: Prove every gate can still fail
        env:
          RELEASE_CHECKS: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$RELEASE_CHECKS" = "true" ]; then
            pnpm run gates:self-test -- --release
          else
            pnpm run gates:self-test
          fi

      - name: Rebuild clean artifacts after mutations
        run: |
          git diff --exit-code
          rm -rf dist
          pnpm exec nx run-many -t build --projects=kernel,angular,react,vue,solid --skip-nx-cache

      - name: Verify fresh packed consumers
        run: |
          node tools/verify-tarball-consumer.mjs
          node tools/verify-consumer-typecheck.mjs
          git diff --exit-code

  demo-route-smoke:
    name: Demo route smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-tags` + full depth: release-claims diffs the public API
          # against the last STABLE version tag. A shallow, tagless checkout made
          # it exit 1 with "No prior version tag found" — a CI-only failure that
          # passed on every laptop, which is the worst shape a gate failure can
          # have.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build demo (production)
        run: pnpm exec nx build demo --configuration=production

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Route smoke (8 key routes, no console errors, visible h1/main)
        run: pnpm run smoke:routes
