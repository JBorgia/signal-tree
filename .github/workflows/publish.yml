name: Publish to npm (CI)

# The SANCTIONED publish path (v12 audit intake, 2026-07-24).
# =============================================================
# Publishes every @signaltree/* package from the EXACT tagged commit, but
# only after the `verify` job reruns the full gate set on that commit —
# the protected-check architecture: no human laptop state, no gate bypass.
#
# Owner setup (one-time):
#   1. Configure npm trusted publishing for each publishable package:
#      owner/repo `JBorgia/signaltree`, workflow filename `publish.yml`, allowed
#      action `npm publish`.
#   2. Protect tags: Settings → Rules → Rulesets → new tag ruleset matching
#      `v*` restricting who can create tags; and require the "Verify tagged
#      commit (full gate set)" check on main via branch protection so no
#      unverified commit can be tagged for release.
#
# Usage: Actions → "Publish to npm (CI)" → Run workflow → enter the version
# tag (e.g. v12.0.1). The `release: published` trigger also fires for a
# release published manually in the GitHub UI — but NOT for releases created
# by release.yml (GITHUB_TOKEN events never trigger other workflows), so the
# normal flow is: push signed tag → release.yml verifies + creates the
# release → dispatch this workflow with the tag.
#
# scripts/release.sh prepares and pushes signed tags; it cannot publish npm
# packages. Tagged CI is the sanctioned registry path.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to publish (for example v12.0.1)'
        required: true
        type: string
  release:
    types: [published]

jobs:
  verify:
    name: Verify and publish tagged commit
    runs-on: ubuntu-latest
    if: github.repository == 'JBorgia/signal-tree'
    permissions:
      contents: read
      id-token: write
    outputs:
      tag_name: ${{ steps.release_tag.outputs.tag_name }}
    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag }}"
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi

          if [[ "$TAG_NAME" != v* ]]; then
            echo "Expected a version tag like v12.0.1, got: ${TAG_NAME}"
            exit 1
          fi

          echo "Publishing from tag ${TAG_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag_name }}
          # `fetch-tags` + full depth: release-claims diffs the public API
          # against the last STABLE version tag. A shallow, tagless checkout made
          # it exit 1 with "No prior version tag found" — a CI-only failure that
          # passed on every laptop, which is the worst shape a gate failure can
          # have.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Use npm CLI with trusted publishing support
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Verify tag matches package.json version
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag_name }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # The gates read dist/ — barrels, bundle budgets, foldability, tarball
      # contents. `gates` verifies a build; it does not produce one.
      - name: Build all packages
        run: pnpm run build:all

      - name: All release gates (including benchmark, memory, and package harnesses)
        run: pnpm run gates -- --release

      - name: Prove every gate can still fail
        run: pnpm run gates:self-test

      - name: Verify version claims
        run: node scripts/verify-version-claims.js

      - name: Tarball-consumer gate (self-test, then gate)
        run: |
          node tools/verify-tarball-consumer.mjs --self-test
          node tools/verify-tarball-consumer.mjs

      - name: Verify CHANGELOG has an entry for this version
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          bash scripts/verify-changelog-entry.sh --self-test
          bash scripts/verify-changelog-entry.sh "$VERSION"

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/publish-candidate.mjs --ci --prebuilt
