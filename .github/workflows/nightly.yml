name: Nightly

# BRIEF.md 6.1: every scenario, S5 included, and the oracle at 100,000
# sequences. ci/done-check.mjs reads this workflow on main: it needs a green
# `gates (<adapter>)` job for plain, angular, vue, solid, preact and react, and
# a green `oracle (100k)` job, on two consecutive runs. Each adapter's job is
# added when that adapter exists.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gates-angular:
    name: gates (angular)
    runs-on: ${{ fromJSON(vars.SIGNAL_TREE_GATES_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 240
    # Set exactly when runs-on aims at the gate runner; ci/gate-host.mjs then
    # requires the provisioning marker (#18).
    env:
      SIGNAL_TREE_GATES_RUNNER: ${{ vars.SIGNAL_TREE_GATES_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Chromium pinned by the Playwright lock
        run: pnpm --filter @signal-tree/bench exec playwright install --with-deps --no-shell chromium
      # #18: on the gate runner (the host with the provisioning marker), gates
      # run only with every core on the performance governor, boost readable and
      # uniform, no swap, no other job and a low load; off it, this only reports.
      - name: Gate-host preflight (identity, governor, boost, swap, quiet host)
        run: node ci/gate-host.mjs --pre
      # --record-only takes effect only while budgets.json has "approved": false.
      # ci/done-check.mjs reads the verdicts in this job's results, not the job's
      # success, and counts record-only results as unmet.
      - name: Every scenario, S5 compressed (at least 2M writes)
        run: pnpm bench all --s5-compressed --record-only
      # Re-checks the host after the gates. If it failed either check or its
      # governor, boost or swap changed, the results are marked invalid: unmet
      # for ci/done-check.mjs and never a baseline. Before the upload, so the
      # marks and gate-host-post.json ride in the same artifact.
      - name: Gate-host re-check (invalidates the results if the host changed)
        if: always()
        run: node ci/gate-host.mjs --post
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gates-angular
          path: bench/out/*.json
          if-no-files-found: ignore

  oracle:
    name: oracle (100k)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As in CI at 100,000 sequences: once the core is registered, generate exits
      # non-zero when it violates a property or when a generatable behavior is
      # checked on it fewer than 1,000 times. A fresh seed each night widens what
      # the PR runs' fixed seed covers. ci/done-check.mjs reads the report.
      - name: Spec properties hold on the core, each checked at least 1,000 times
        run: pnpm oracle generate --runs 100000 --seed ${{ github.run_id }}
      # After generate, so the result is also recorded in its spec-report.json.
      - name: Replays are deterministic over 100,000 sequences
        if: ${{ !cancelled() }}
        run: pnpm oracle --determinism --subject v16 --runs 100000
      - name: Keep the oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-oracle
          path: tests/oracle/out/
          if-no-files-found: ignore
