name: CI

on:
  pull_request:
  push:
    branches: [main, 'rebuild/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, boundaries, S6, tests, port manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the source tags the port manifest is built from
        run: git fetch --no-tags --depth=1 origin refs/tags/v15.4.9:refs/tags/v15.4.9 refs/tags/v16.0.0-rc.1:refs/tags/v16.0.0-rc.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint, 4.1 import boundaries and rule 7 reachability
        run: pnpm lint
      - name: S6(a) no plugin code, S6(c) byte identity, no bench-only code in production
        run: pnpm scan:core-bundle
      - run: pnpm test
      - name: Port manifest matches the source tags
        run: pnpm manifest:check --tags
      - name: Spec tests match tests/spec-tests.json (BRIEF.md 12.1.6)
        run: node ci/spec-tests.mjs check

  oracle:
    name: Oracle, spec properties and determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the oracle
        run: pnpm --filter @signal-tree/oracle typecheck
      - name: Oracle self-tests
        run: pnpm --filter @signal-tree/oracle test
      # BRIEF.md 12.1.4: the oracle is a spec-driven test generator. Old packages
      # violating the spec is expected and reported, because the spec wins and each
      # such case becomes a new test. The new core is gated: once it is registered
      # as the subject `core`, generate exits non-zero when it violates a property
      # or when a generatable behavior is checked on it fewer than 100 times
      # (tests/oracle/src/gate.ts). Until then this step is a no-op gate.
      - name: Spec properties hold on the core, each checked at least 100 times
        run: pnpm oracle generate --runs 10000 --seed 20261119
      # After generate, so the result is also recorded in its spec-report.json.
      - name: Replays are deterministic over 10,000 sequences
        if: ${{ !cancelled() }}
        run: pnpm oracle --determinism --subject v16 --runs 10000
      - name: Keep the oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-report
          path: tests/oracle/out/
          if-no-files-found: ignore

  pr-lookup:
    # Finding 6: a branch with an open PR runs the gates through pull_request
    # only, so a push to it does not start a second gates run.
    name: Open PR for this branch?
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.lookup.outputs.open }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q 'length')
          echo "open=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  gates:
    # Ruling 10: gates run on the dedicated self-hosted runner named by
    # SIGNAL_TREE_GATES_RUNNER (#14; its labels include signal-tree-gates),
    # falling back to ubuntu-latest until it exists.
    name: Gates (Angular reference app)
    needs: pr-lookup
    # Never on a fork's pull request: the gates runner is self-hosted and the repository public.
    if: >-
      always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      || (github.event_name == 'push' && needs.pr-lookup.outputs.open != 'true'))
    runs-on: ${{ fromJSON(vars.SIGNAL_TREE_GATES_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 120
    # Set exactly when runs-on aims at the gate runner; ci/gate-host.mjs then
    # requires the provisioning marker, and that it, RUNNER_NAME and the pinned
    # SIGNAL_TREE_GATE_RUNNER_NAME all name the same runner (#18). There the
    # Playwright Chromium is the one root installed under /opt/ms-playwright and
    # the toolchain manifest lists; on the hosted fallback, Playwright's default.
    env:
      SIGNAL_TREE_GATES_RUNNER: ${{ vars.SIGNAL_TREE_GATES_RUNNER }}
      SIGNAL_TREE_GATE_RUNNER_NAME: ${{ vars.SIGNAL_TREE_GATE_RUNNER_NAME }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ vars.SIGNAL_TREE_GATES_RUNNER != '' && '/opt/ms-playwright' || '' }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: gates-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # #18, first after checkout, before pnpm install runs any package code: on
      # the gate runner (an ephemeral runner as a fresh unprivileged user), the
      # identity, the root-installed toolchain and the user, then every core on
      # the performance governor, boost readable and uniform, no swap, one runner,
      # no other job and a low load. Off it, this only reports.
      - name: Gate-host preflight (identity, toolchain, user, governor, boost, swap, quiet host)
        run: node ci/gate-host.mjs --pre
      # On the gate runner, Node, pnpm and Chromium were installed once by root and
      # the preflight verified them; these downloads, and the browser install that
      # needs sudo, run on the hosted fallback only.
      - uses: pnpm/action-setup@v4
        if: vars.SIGNAL_TREE_GATES_RUNNER == ''
      - uses: actions/setup-node@v4
        if: vars.SIGNAL_TREE_GATES_RUNNER == ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Chromium pinned by the Playwright lock (ruling 10)
        if: vars.SIGNAL_TREE_GATES_RUNNER == ''
        run: pnpm --filter @signal-tree/bench exec playwright install --with-deps --no-shell chromium
      - name: Typecheck the harness
        run: pnpm --filter @signal-tree/bench typecheck
      - name: Harness self-tests
        run: pnpm bench:test
      # Fails when main has a baseline that cannot be fetched, and when there is
      # no baseline once budgets.json is approved (finding 1).
      - name: Fetch main's latest baseline and A/A noise
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/gate-baseline.mjs --out "$RUNNER_TEMP/main-gates"
      # --record-only takes effect only while budgets.json has "approved": false;
      # once approved, red gates fail the job (finding 4). S8 (scaling) is a
      # Node gate like M1–M3; main records no S8 baseline until the new core's
      # Phase 1 (ruling 9), so it is compared with nothing until then.
      - name: PR gates (M1–M3, S1, S3, S6–S8)
        if: github.ref != 'refs/heads/main'
        run: pnpm bench M1 M2 M3 S1 S3 S6 S7 S8 --record-only $BASELINE_ARGS
      - name: Main's baselines and A/A noise (M1–M3, S1, S2; ruling 9)
        if: github.ref == 'refs/heads/main'
        run: |
          pnpm bench M1 M2 M3 S1 S2 --aa --record-only
          cp bench/out/aa-*-latest.json bench/out/aa-latest.json
          # Where and how it was recorded (runner, governor, boost) is in
          # gate-host.json, uploaded with it; PR runs compare only with a valid
          # baseline from the same gate runner with the same governor and boost.
      # Re-checks the host after the gates and stops the preflight's sampler. If
      # either check failed, the sampler saw another job or runner, or the
      # governor, boost or swap changed, the results are marked invalid: unmet
      # for ci/done-check.mjs and never a baseline. The load is recorded, not
      # judged. Before the upload, so the marks and the gate-host records ride
      # in the same artifact.
      - name: Gate-host re-check (invalidates the results if the host changed)
        if: always()
        run: node ci/gate-host.mjs --post
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: bench/out/*.json
          if-no-files-found: ignore

  no-attribution:
    # Required check (ruling 17's ruleset): no commit in the pull request and
    # not its description may carry tool attribution (ci/attribution.mjs).
    name: No tool attribution in commits or description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check every commit in the pull request and its description
        run: node ci/no-attribution.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
