name: Release container full qualification probe

# One isolated investigation branch. No publishing, secrets, gate substitution
# or production deployment. The container probe builds the immutable candidate.
on:
  push:
    branches: [codex/v15-runner-diagnostics]

permissions:
  contents: read

jobs:
  packaged-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # Official Playwright 1.56.1 Noble image, matching the locked JS package.
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b29a189798b65ba0a243da349036d5b1e1b7168
          fetch-depth: 0
      - name: Trust only the exact mounted candidate checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 0b29a189798b65ba0a243da349036d5b1e1b7168
          git status --porcelain
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify matching packaged Chromium
        run: |
          pnpm exec playwright install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { chromium } from 'playwright';
          const require = createRequire(import.meta.url);
          assert.equal(require('playwright/package.json').version, '1.56.1');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.setContent('<!doctype html><title>Packaged browser ready</title>');
            assert.equal(await page.title(), 'Packaged browser ready');
            console.log(JSON.stringify({ node: process.version, browser: browser.version(), playwright: '1.56.1' }));
          } finally { await browser.close(); }
          JS
      - name: Full unchanged candidate gates
        run: |
          pnpm run build:all
          node tools/verify-gates.mjs --release
      - name: Full mutation proofs
        run: node tools/verify-gates.mjs --self-test --release
      - name: Rebuild and verify final candidate without publication
        run: |
          git diff --exit-code
          rm -rf dist
          pnpm run build:all --skip-nx-cache
          node tools/verify-tarball-consumer.mjs
          node tools/verify-consumer-typecheck.mjs
          node tools/verify-angular-aot-consumer.mjs
          node scripts/publish-candidate.mjs --prepare-only --prebuilt
          git diff --exit-code

  mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record APT sources and independently test signed mirror metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile

          for source in [
              '/etc/os-release',
              '/etc/apt/sources.list',
              '/etc/apt/sources.list.d/ubuntu.sources',
              '/etc/apt/apt-mirrors.txt',
              '/etc/apt/security-mirrors.txt',
          ]:
              path = pathlib.Path(source)
              print(json.dumps({'source': source, 'text': path.read_text() if path.exists() else None}), flush=True)

          destinations = [
              ('azure.archive.ubuntu.com', 'noble'),
              ('archive.ubuntu.com', 'noble'),
              ('security.ubuntu.com', 'noble-security'),
          ]
          work = pathlib.Path(tempfile.mkdtemp(prefix='release-mirror-diagnostic-'))
          for index, (host, suite) in enumerate(destinations):
              try:
                  resolved = subprocess.run(['getent', 'ahostsv4', host], capture_output=True, text=True, timeout=15)
                  print(json.dumps({'host': host, 'dnsExit': resolved.returncode, 'addresses': resolved.stdout, 'stderr': resolved.stderr}), flush=True)
              except subprocess.TimeoutExpired:
                  print(json.dumps({'host': host, 'dnsTimeoutSeconds': 15}), flush=True)
              target = work / str(index)
              try:
                  fetched = subprocess.run([
                      'curl', '--fail', '--silent', '--show-error', '--location',
                      '--proto', '=https', '--proto-redir', '=https',
                      '--connect-timeout', '10', '--max-time', '30',
                      '--write-out', '%{http_code} %{remote_ip}', '--output', str(target),
                      f'https://{host}/ubuntu/dists/{suite}/InRelease',
                  ], capture_output=True, text=True, timeout=35)
              except subprocess.TimeoutExpired:
                  print(json.dumps({'host': host, 'httpsTimeoutSeconds': 35}), flush=True)
                  continue
              print(json.dumps({'host': host, 'httpsExit': fetched.returncode, 'httpAndPeer': fetched.stdout, 'stderr': fetched.stderr}), flush=True)
              if fetched.returncode == 0:
                  try:
                      verified = subprocess.run([
                          'gpgv', '--keyring', '/usr/share/keyrings/ubuntu-archive-keyring.gpg', str(target),
                      ], capture_output=True, text=True, timeout=10)
                  except subprocess.TimeoutExpired:
                      print(json.dumps({'host': host, 'signatureTimeoutSeconds': 10}), flush=True)
                      continue
                  print(json.dumps({'host': host, 'ubuntuSignatureExit': verified.returncode, 'stderr': verified.stderr}), flush=True)
          PY
