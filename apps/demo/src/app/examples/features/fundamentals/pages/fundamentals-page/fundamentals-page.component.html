<div class="fundamentals-page layout-frame">
  <st-example
    id="signals-basics"
    heading="Nested state. Direct updates."
    [headingLevel]="1"
    intro="Change the item count or price. The total updates from the same typed state."
    [code]="codeFiles"
  >
    <div class="sequence-step sequence-step--interactive">
      <h2>{{ tree.$.customer.name() }}'s cart</h2>
      <div class="write-controls">
        <button type="button" (click)="removeItem()">Remove item</button>
        <output aria-label="Item count">{{ tree.$.cart.itemCount() }}</output>
        <button type="button" (click)="addItem()">Add item</button>
      </div>
      <label for="unit-price">Unit price</label>
      <input
        id="unit-price"
        type="number"
        min="0"
        [value]="tree.$.cart.unitPrice()"
        (input)="setUnitPrice(+$any($event.target).value)"
      />
      <dl class="derived-result" aria-live="polite">
        <div>
          <dt>Summary</dt>
          <dd>{{ tree.$.summary() }}</dd>
        </div>
        <div>
          <dt>Subtotal</dt>
          <dd>{{ tree.$.subtotal() }}</dd>
        </div>
      </dl>
    </div>
  </st-example>
  <nav class="concept-links" aria-label="Next SignalTree concepts">
    @for (concept of nextConcepts; track concept.route) {
    <a [routerLink]="concept.route"
      ><strong>{{ concept.title }}</strong
      ><small>{{ concept.description }}</small
      ><span aria-hidden="true">→</span></a
    >
    }
  </nav>
</div>
