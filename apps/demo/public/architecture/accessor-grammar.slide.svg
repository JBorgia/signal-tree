<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="accessor-grammar-slide-title accessor-grammar-slide-description" data-diagram="accessor-grammar" data-variant="slide">
  <title id="accessor-grammar-slide-title">The API follows the shape of the location</title>
  <desc id="accessor-grammar-slide-description">The controller itself is not callable. Its root $, branch accessors, and terminal locations support read, whole-value replacement, and updater calls. leaf(value) makes an object or callable terminal instead of traversable; wrapping a callable again at write time distinguishes data from an updater. EntityMap exposes collection operations.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes p { margin: 0; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--st-line); background: var(--st-line); gap: 1px; }
  .story-item { min-width: 0; padding: 14px 16px; background: var(--st-surface); }
  .story-item--plain { background: var(--st-authored); }
  .story-item--example { background: var(--st-framework); }
  .story-item--money { background: var(--st-restoration); }
  .story-item h2 { margin-bottom: 6px; font-size: 12px; }
  .story-item p { font-size: 14px; line-height: 1.45; }
  .slide-story { box-sizing: border-box; height: 100%; color: var(--st-ink); font: 18px/1.4 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .slide-story .story-item { padding: 16px 18px; }
  .slide-story .story-item h2 { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="accessor-grammar-slide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="accessor-grammar-slide-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1920" height="1080" fill="var(--st-surface)"/>
  <rect width="1920" height="1080" fill="url(#accessor-grammar-slide-grid)"/>
  <text class="slide-title" x="120" y="120">The API follows the shape of the location</text>
  <text class="slide-takeaway" x="120" y="180">Root, branches, and terminal leaves share one callable grammar; leaf(value) declares where topology stops.</text>
  <g transform="translate(342.8571428571429 220) scale(1.1868131868131868)"><g class="edge-paths"></g><g class="nodes"><g class="node node--kernel"><title>Root accessor</title><rect x="25" y="70" width="235" height="295" rx="0"/><text class="node-title" x="142.5" y="223.5" text-anchor="middle"><tspan x="142.5" dy="0">Root accessor</tspan></text></g><g class="node node--authored"><title>Branch accessor</title><rect x="275" y="70" width="235" height="295" rx="0"/><text class="node-title" x="392.5" y="223.5" text-anchor="middle"><tspan x="392.5" dy="0">Branch accessor</tspan></text></g><g class="node node--framework"><title>Terminal location</title><rect x="525" y="70" width="235" height="295" rx="0"/><text class="node-title" x="642.5" y="223.5" text-anchor="middle"><tspan x="642.5" dy="0">Terminal location</tspan></text></g><g class="node node--identity"><title>EntityMap collection</title><rect x="775" y="70" width="240" height="295" rx="0"/><text class="node-title" x="895" y="223.5" text-anchor="middle"><tspan x="895" dy="0">EntityMap collection</tspan></text></g></g><g class="edge-labels"></g></g>
  <foreignObject x="120" y="790" width="1680" height="220">
    <section xmlns="http://www.w3.org/1999/xhtml" class="slide-story">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>The way you read or change state matches what you are touching: the whole tree, one object, one simple value, or a keyed collection.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>A checkout replaces a complete shipping address, increments an item quantity, and looks up products by ID through their matching APIs.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>The type system catches accidental partial replacements that could erase an address field, drop an item, or calculate an order from incomplete data.</p></div></div>
    </section>
  </foreignObject>
</svg>
