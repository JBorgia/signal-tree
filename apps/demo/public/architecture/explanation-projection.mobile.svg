<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 360 700" role="img" aria-labelledby="explanation-projection-mobile-title explanation-projection-mobile-description" data-diagram="explanation-projection" data-variant="mobile">
  <title id="explanation-projection-mobile-title">Explanation is a projection over causal truth</title>
  <desc id="explanation-projection-mobile-description">The kernel retains the facts required by shipped causal and restoration behavior. Product-specific context can be combined with those stable identities to produce explanations without making prose part of state authority.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="explanation-projection-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="explanation-projection-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="360" height="700" fill="var(--st-surface)"/>
  <rect width="360" height="700" fill="url(#explanation-projection-mobile-grid)"/>
  <g><rect class="group-box group-box--projection dashed" x="12" y="165" width="336" height="515" rx="0"/><text class="group-label" x="24" y="183">Product projection · not a public API</text></g><g><g><path class="edge" d="M 118.4054054054054 125 L 155.59459459459458 205" marker-end="url(#explanation-projection-mobile-arrow)"/></g><g><path class="edge" d="M 241.59459459459458 125 L 204.40540540540542 205" marker-end="url(#explanation-projection-mobile-arrow)"/></g><g><path class="edge" d="M 180 310 L 180 365" marker-end="url(#explanation-projection-mobile-arrow)"/></g><g><path class="edge" d="M 153.44117647058823 470 L 120.55882352941177 535" marker-end="url(#explanation-projection-mobile-arrow)"/></g><g><path class="edge" d="M 206.55882352941177 470 L 239.44117647058823 535" marker-end="url(#explanation-projection-mobile-arrow)"/></g></g><g><g class="node node--kernel"><title>Minimal causal truth turns · participants · effects</title><rect x="12" y="20" width="164" height="105" rx="0"/><text class="node-title" x="94" y="54.5" text-anchor="middle"><tspan x="94" dy="0">Minimal</tspan><tspan x="94" dy="22">causal truth</tspan></text><text class="node-detail" x="94" y="101.5" text-anchor="middle"><tspan x="94" dy="0">turns · participants · effects</tspan></text></g><g class="node node--identity"><title>Stable identities owner · position · subject</title><rect x="184" y="20" width="164" height="105" rx="0"/><text class="node-title" x="266" y="65.5" text-anchor="middle"><tspan x="266" dy="0">Stable identities</tspan></text><text class="node-detail" x="266" y="90.5" text-anchor="middle"><tspan x="266" dy="0">owner · position · subject</tspan></text></g><g class="node node--application"><title>Application context domain metadata · user intent</title><rect x="24" y="205" width="312" height="105" rx="0"/><text class="node-title" x="180" y="250.5" text-anchor="middle"><tspan x="180" dy="0">Application context</tspan></text><text class="node-detail" x="180" y="275.5" text-anchor="middle"><tspan x="180" dy="0">domain metadata · user intent</tspan></text></g><g class="node node--projection"><title>Projection interprets; never becomes authority</title><rect x="24" y="365" width="312" height="105" rx="0"/><text class="node-title" x="180" y="410.5" text-anchor="middle"><tspan x="180" dy="0">Projection</tspan></text><text class="node-detail" x="180" y="435.5" text-anchor="middle"><tspan x="180" dy="0">interprets; never becomes authority</tspan></text></g><g class="node node--authored"><title>Human explanation product-facing narrative</title><rect x="12" y="535" width="164" height="105" rx="0"/><text class="node-title" x="94" y="569.5" text-anchor="middle"><tspan x="94" dy="0">Human</tspan><tspan x="94" dy="22">explanation</tspan></text><text class="node-detail" x="94" y="616.5" text-anchor="middle"><tspan x="94" dy="0">product-facing narrative</tspan></text></g><g class="node node--external"><title>AI explanation same facts different projection</title><rect x="184" y="535" width="164" height="105" rx="0"/><text class="node-title" x="266" y="560.5" text-anchor="middle"><tspan x="266" dy="0">AI</tspan><tspan x="266" dy="22">explanation</tspan></text><text class="node-detail" x="266" y="607.5" text-anchor="middle"><tspan x="266" dy="0">same facts</tspan><tspan x="266" dy="18">different projection</tspan></text></g></g>
</svg>
