<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 360 850" role="img" aria-labelledby="causal-authority-mobile-title causal-authority-mobile-description" data-diagram="causal-authority" data-variant="mobile">
  <title id="causal-authority-mobile-title">Authority and restoration are separate axes</title>
  <desc id="causal-authority-mobile-description">external() means another authority owned the decision. Transactions can group authored work and defer settlement, but they are not a third authority class.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="causal-authority-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="causal-authority-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="360" height="850" fill="var(--st-surface)"/>
  <rect width="360" height="850" fill="url(#causal-authority-mobile-grid)"/>
  <g><rect class="group-box group-box--neutral dashed" x="12" y="15" width="336" height="115" rx="0"/><text class="group-label" x="24" y="33">Orthogonal operation boundary · transaction()</text></g><g><g><path class="edge dashed" d="M 180 110 L 180 180" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="138" y="125.5" width="84" height="23" rx="0"/><text class="edge-label" x="180" y="140.4" text-anchor="middle"><tspan x="180" dy="0">groups</tspan></text></g></g><g><path class="edge" d="M 155.24242424242425 275 L 126.57575757575758 330" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="88.4090909090909" y="283" width="105" height="23" rx="0"/><text class="edge-label" x="140.9090909090909" y="297.9" text-anchor="middle"><tspan x="140.9090909090909" dy="0">this operation</tspan></text></g></g><g><path class="edge" d="M 204.75757575757575 275 L 233.42424242424244 330" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="157.0909090909091" y="283" width="124" height="23" rx="0"/><text class="edge-label" x="219.0909090909091" y="297.9" text-anchor="middle"><tspan x="219.0909090909091" dy="0">another authority</tspan></text></g></g><g><path class="edge" d="M 94 455 L 94 520" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="52" y="468" width="84" height="23" rx="0"/><text class="edge-label" x="94" y="482.9" text-anchor="middle"><tspan x="94" dy="0">ordinary</tspan></text></g></g><g><path class="edge" d="M 154.56338028169014 455 L 207.85915492957747 510" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="139.2112676056338" y="463" width="84" height="23" rx="0"/><text class="edge-label" x="181.2112676056338" y="477.9" text-anchor="middle"><tspan x="181.2112676056338" dy="0">optional</tspan></text></g></g><g><path class="edge" d="M 266 630 L 266 700" marker-end="url(#causal-authority-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="224" y="645.5" width="84" height="23" rx="0"/><text class="edge-label" x="266" y="660.4" text-anchor="middle"><tspan x="266" dy="0">eligible</tspan></text></g></g></g><g><g class="node node--neutral"><title>operation may be pending until confirm / rollback</title><rect x="24" y="45" width="312" height="65" rx="0"/><text class="node-title" x="180" y="70.5" text-anchor="middle"><tspan x="180" dy="0">operation</tspan></text><text class="node-detail" x="180" y="95.5" text-anchor="middle"><tspan x="180" dy="0">may be pending until confirm / rollback</tspan></text></g><g class="node node--kernel"><title>WRITE classify who owned the decision</title><rect x="24" y="180" width="312" height="95" rx="0"/><text class="node-title" x="180" y="220.5" text-anchor="middle"><tspan x="180" dy="0">WRITE</tspan></text><text class="node-detail" x="180" y="245.5" text-anchor="middle"><tspan x="180" dy="0">classify who owned the decision</tspan></text></g><g class="node node--authored"><title>Authored ordinary application writes including transaction work</title><rect x="12" y="330" width="164" height="125" rx="0"/><text class="node-title" x="94" y="376.5" text-anchor="middle"><tspan x="94" dy="0">Authored</tspan></text><text class="node-detail" x="94" y="401.5" text-anchor="middle"><tspan x="94" dy="0">ordinary application writes</tspan><tspan x="94" dy="18">including transaction work</tspan></text></g><g class="node node--external"><title>External external(() =&gt; applyTruth()) never an authored turn</title><rect x="184" y="330" width="164" height="125" rx="0"/><text class="node-title" x="266" y="367.5" text-anchor="middle"><tspan x="266" dy="0">External</tspan></text><text class="node-detail node-detail--code" x="266" y="392.5" text-anchor="middle"><tspan x="266" dy="0">external(() =&gt;</tspan><tspan x="266" dy="18">applyTruth())</tspan><tspan x="266" dy="18">never an authored turn</tspan></text></g><g class="node node--neutral"><title>Undesignated by default no restoration retention</title><rect x="12" y="520" width="164" height="100" rx="0"/><text class="node-title" x="94" y="552" text-anchor="middle"><tspan x="94" dy="0">Undesignated</tspan><tspan x="94" dy="22">by default</tspan></text><text class="node-detail" x="94" y="599" text-anchor="middle"><tspan x="94" dy="0">no restoration retention</tspan></text></g><g class="node node--restoration"><title>Restoration designation undoable(() =&gt; authoredWork())</title><rect x="184" y="510" width="164" height="120" rx="0"/><text class="node-title" x="266" y="543" text-anchor="middle"><tspan x="266" dy="0">Restoration</tspan><tspan x="266" dy="22">designation</tspan></text><text class="node-detail node-detail--code" x="266" y="590" text-anchor="middle"><tspan x="266" dy="0">undoable(() =&gt;</tspan><tspan x="266" dy="18">authoredWork())</tspan></text></g><g class="node node--restoration"><title>Eligible for retained restoration history bounded by restoration policy</title><rect x="184" y="700" width="164" height="120" rx="0"/><text class="node-title" x="266" y="722" text-anchor="middle"><tspan x="266" dy="0">Eligible for</tspan><tspan x="266" dy="22">retained</tspan><tspan x="266" dy="22">restoration history</tspan></text><text class="node-detail" x="266" y="791" text-anchor="middle"><tspan x="266" dy="0">bounded by</tspan><tspan x="266" dy="18">restoration policy</tspan></text></g></g>
</svg>
