  <pattern id="coherent-operation-docs-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1040" height="950" fill="var(--st-surface)"/>
  <rect width="1040" height="520" fill="url(#coherent-operation-docs-grid)"/>
  <g class="edge-paths"><path class="edge" d="M 220 225 L 265 225" marker-end="url(#coherent-operation-docs-arrow)"/><path class="edge" d="M 455 225 L 500 225" marker-end="url(#coherent-operation-docs-arrow)"/><path class="edge" d="M 690 225 L 735 225" marker-end="url(#coherent-operation-docs-arrow)"/><path class="edge" d="M 831.4285714285714 275 L 773.5714285714286 350" marker-end="url(#coherent-operation-docs-arrow)"/><path class="edge" d="M 600 400 L 500 400" marker-end="url(#coherent-operation-docs-arrow)"/></g><g class="nodes"><g class="node node--application"><title>transaction(() =&gt; …) one semantic operation</title><rect x="30" y="175" width="190" height="100" rx="0"/><text class="node-title" x="125" y="218" text-anchor="middle"><tspan x="125" dy="0">transaction(() =&gt; …)</tspan></text><text class="node-detail node-detail--code" x="125" y="243" text-anchor="middle"><tspan x="125" dy="0">one semantic operation</tspan></text></g><g class="node node--authored"><title>multiple mutations scalar + structural</title><rect x="265" y="175" width="190" height="100" rx="0"/><text class="node-title" x="360" y="218" text-anchor="middle"><tspan x="360" dy="0">multiple mutations</tspan></text><text class="node-detail" x="360" y="243" text-anchor="middle"><tspan x="360" dy="0">scalar + structural</tspan></text></g><g class="node node--neutral"><title>private substrate commits one or more</title><rect x="500" y="175" width="190" height="100" rx="0"/><text class="node-title" x="595" y="207" text-anchor="middle"><tspan x="595" dy="0">private substrate</tspan><tspan x="595" dy="22">commits</tspan></text><text class="node-detail" x="595" y="254" text-anchor="middle"><tspan x="595" dy="0">one or more</tspan></text></g><g class="node node--kernel"><title>coherent publication no heterogeneous midpoint</title><rect x="735" y="175" width="270" height="100" rx="0"/><text class="node-title" x="870" y="218" text-anchor="middle"><tspan x="870" dy="0">coherent publication</tspan></text><text class="node-detail" x="870" y="243" text-anchor="middle"><tspan x="870" dy="0">no heterogeneous midpoint</tspan></text></g><g class="node node--framework"><title>framework invalidation request to reread truth</title><rect x="600" y="350" width="270" height="100" rx="0"/><text class="node-title" x="735" y="393" text-anchor="middle"><tspan x="735" dy="0">framework invalidation</tspan></text><text class="node-detail" x="735" y="418" text-anchor="middle"><tspan x="735" dy="0">request to reread truth</tspan></text></g><g class="node node--identity"><title>observer sees only the final state</title><rect x="230" y="350" width="270" height="100" rx="0"/><text class="node-title" x="365" y="393" text-anchor="middle"><tspan x="365" dy="0">observer</tspan></text><text class="node-detail" x="365" y="418" text-anchor="middle"><tspan x="365" dy="0">sees only the final state</tspan></text></g></g><g class="edge-labels"><g class="edge-label-group"><rect class="edge-label-plate" x="508" y="380" width="84" height="24" rx="0"/><text class="edge-label" x="550" y="395.74" text-anchor="middle"><tspan x="550" dy="0">reread</tspan></text></g></g>
  <foreignObject x="24" y="538" width="992" height="394">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>Several related changes may happen inside, but everyone watching sees them arrive together as one complete result.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>Moving $20 from checking to savings changes both balances. The screen never sees the debit without the matching credit.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>A half-finished transfer can trigger a false overdraft, fee, or alert. Coherent publication prevents decisions based on that temporary state.</p></div></div>
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>Physical revisions are implementation stamps, not transaction identities.</li><li>Observers cannot see scalar-only or structural-only intermediate transaction state.</li><li>Owner invalidation carries no value or path; the framework rereads canonical truth.</li></ul></div><div><h2>Code evidence</h2><ul><li><code>packages/kernel/src/lib/heterogeneous-atomicity.spec.ts</code></li><li><code>packages/kernel/src/adapter.ts</code></li><li><code>packages/kernel/src/lib/owner-invalidation.spec.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
</svg>
