<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 360 840" role="img" aria-labelledby="link-mobile-title link-mobile-description" data-diagram="link" data-variant="mobile">
  <title id="link-mobile-title">Link owns synchronization, not backend policy</title>
  <desc id="link-mobile-description">A Link can pull endpoint truth, push settled tree truth, or subscribe to live endpoint truth. Inbound values are applied as external authority. The endpoint decides storage, transport, codec, retry, cache, and scheduling policy. In plain words: Link keeps a state location connected to something outside. Your application still decides how to fetch, save, retry, and store that data. Real app example: A saved cart loads from an API, sends settled edits back, and listens for stock changes. The API service owns HTTP and retry rules. Why money cares: Keeping retry and durability policy in endpoint code makes duplicate charges and lost saves easier to prevent, test, and audit.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes p { margin: 0; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--st-line); background: var(--st-line); gap: 1px; }
  .story-item { min-width: 0; padding: 14px 16px; background: var(--st-surface); }
  .story-item--plain { background: var(--st-authored); }
  .story-item--example { background: var(--st-framework); }
  .story-item--money { background: var(--st-restoration); }
  .story-item h2 { margin-bottom: 6px; font-size: 12px; }
  .story-item p { font-size: 14px; line-height: 1.45; }
  .slide-story { box-sizing: border-box; height: 100%; color: var(--st-ink); font: 18px/1.4 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .slide-story .story-item { padding: 16px 18px; }
  .slide-story .story-item h2 { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="link-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="link-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="360" height="840" fill="var(--st-surface)"/>
  <rect width="360" height="840" fill="url(#link-mobile-grid)"/>
  <g class="edge-paths"><path class="edge" d="M 210.85714285714286 140 L 252 220" marker-end="url(#link-mobile-arrow)"/><path class="edge" d="M 288 360 L 288 460" marker-start="url(#link-mobile-arrow)" marker-end="url(#link-mobile-arrow)"/><path class="edge" d="M 288 590 L 288 680" marker-end="url(#link-mobile-arrow)"/><path class="edge dashed" d="M 228 290 L 132 290" marker-end="url(#link-mobile-arrow)"/><path class="edge dashed" d="M 108 220 L 149.14285714285714 140" marker-end="url(#link-mobile-arrow)"/></g><g class="nodes"><g class="node node--kernel"><title>SignalTree location canonical authored truth</title><rect x="120" y="20" width="120" height="120" rx="0"/><text class="node-title" x="180" y="53" text-anchor="middle"><tspan x="180" dy="0">SignalTree</tspan><tspan x="180" dy="22">location</tspan></text><text class="node-detail" x="180" y="100" text-anchor="middle"><tspan x="180" dy="0">canonical</tspan><tspan x="180" dy="18">authored truth</tspan></text></g><g class="node node--restoration"><title>Link retrieve() settled() dispose()</title><rect x="228" y="220" width="120" height="140" rx="0"/><text class="node-title" x="288" y="265" text-anchor="middle"><tspan x="288" dy="0">Link</tspan></text><text class="node-detail node-detail--code" x="288" y="290" text-anchor="middle"><tspan x="288" dy="0">retrieve()</tspan><tspan x="288" dy="18">settled()</tspan><tspan x="288" dy="18">dispose()</tspan></text></g><g class="node node--external"><title>Application endpoint get · set · subscribe</title><rect x="228" y="460" width="120" height="130" rx="0"/><text class="node-title" x="288" y="507" text-anchor="middle"><tspan x="288" dy="0">Application</tspan><tspan x="288" dy="22">endpoint</tspan></text><text class="node-detail" x="288" y="554" text-anchor="middle"><tspan x="288" dy="0">get · set · subscribe</tspan></text></g><g class="node node--application"><title>Backend / policy HTTP · storage socket · codec retry · cache durability</title><rect x="228" y="680" width="120" height="140" rx="0"/><text class="node-title" x="288" y="716" text-anchor="middle"><tspan x="288" dy="0">Backend / policy</tspan></text><text class="node-detail" x="288" y="741" text-anchor="middle"><tspan x="288" dy="0">HTTP · storage</tspan><tspan x="288" dy="18">socket · codec</tspan><tspan x="288" dy="18">retry · cache</tspan><tspan x="288" dy="18">durability</tspan></text></g><g class="node node--external"><title>inbound truth applied through external()</title><rect x="12" y="220" width="120" height="140" rx="0"/><text class="node-title" x="72" y="274" text-anchor="middle"><tspan x="72" dy="0">inbound truth</tspan></text><text class="node-detail node-detail--code" x="72" y="299" text-anchor="middle"><tspan x="72" dy="0">applied through</tspan><tspan x="72" dy="18">external()</tspan></text></g></g><g class="edge-labels"><g class="edge-label-group"><rect class="edge-label-plate" x="187.92857142857144" y="160.5" width="87" height="23" rx="0"/><text class="edge-label" x="231.42857142857144" y="175.4" text-anchor="middle"><tspan x="231.42857142857144" dy="0">settled set</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="246" y="377.5" width="84" height="49" rx="0"/><text class="edge-label" x="288" y="392.4" text-anchor="middle"><tspan x="288" dy="0">get</tspan><tspan x="288" dy="13">set</tspan><tspan x="288" dy="13">subscribe</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="235.5" y="615.5" width="105" height="23" rx="0"/><text class="edge-label" x="288" y="630.4" text-anchor="middle"><tspan x="288" dy="0">implemented by</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="138" y="270.5" width="84" height="23" rx="0"/><text class="edge-label" x="180" y="285.4" text-anchor="middle"><tspan x="180" dy="0">classifies</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="86.57142857142856" y="160.5" width="84" height="23" rx="0"/><text class="edge-label" x="128.57142857142856" y="175.4" text-anchor="middle"><tspan x="128.57142857142856" dy="0">realizes</tspan></text></g></g>
</svg>
