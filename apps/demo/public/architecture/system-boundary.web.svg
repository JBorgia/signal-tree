<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1040 720" role="img" aria-labelledby="system-boundary-web-title system-boundary-web-description" data-diagram="system-boundary" data-variant="web">
  <title id="system-boundary-web-title">SignalTree in one picture</title>
  <desc id="system-boundary-web-description">Application policy chooses the work. Angular and React connect that work to their observation runtimes. The framework-neutral kernel owns the state and causal model beneath both. In plain words: Your app decides what should happen, the framework updates the screen, and SignalTree keeps the one official answer underneath. Real app example: A shopper changes an item quantity. The checkout rule accepts the change, SignalTree stores it, and Angular or React redraws the total. Why money cares: If the screen and store keep separate answers, a shopper can see one total and be charged another. One authority keeps those numbers together.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes p { margin: 0; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--st-line); background: var(--st-line); gap: 1px; }
  .story-item { min-width: 0; padding: 14px 16px; background: var(--st-surface); }
  .story-item--plain { background: var(--st-authored); }
  .story-item--example { background: var(--st-framework); }
  .story-item--money { background: var(--st-restoration); }
  .story-item h2 { margin-bottom: 6px; font-size: 12px; }
  .story-item p { font-size: 14px; line-height: 1.45; }
  .slide-story { box-sizing: border-box; height: 100%; color: var(--st-ink); font: 18px/1.4 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .slide-story .story-item { padding: 16px 18px; }
  .slide-story .story-item h2 { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="system-boundary-web-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="system-boundary-web-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1040" height="720" fill="var(--st-surface)"/>
  <rect width="1040" height="720" fill="url(#system-boundary-web-grid)"/>
  <g class="edge-paths"><path class="edge" d="M 520 135 L 520 190" marker-end="url(#system-boundary-web-arrow)"/><path class="edge" d="M 520 305 L 520 360" marker-end="url(#system-boundary-web-arrow)"/><path class="edge" d="M 520 500 L 520 560" marker-end="url(#system-boundary-web-arrow)"/></g><g class="nodes"><g class="node node--application"><title>Application policy decides product work</title><rect x="200" y="30" width="640" height="105" rx="0"/><text class="node-title" x="520" y="75.5" text-anchor="middle"><tspan x="520" dy="0">Application policy</tspan></text><text class="node-detail" x="520" y="100.5" text-anchor="middle"><tspan x="520" dy="0">decides product work</tspan></text></g><g class="node node--framework"><title>Angular / React realization observe · render · clean up</title><rect x="200" y="190" width="640" height="115" rx="0"/><text class="node-title" x="520" y="229.5" text-anchor="middle"><tspan x="520" dy="0">Angular / React</tspan><tspan x="520" dy="22">realization</tspan></text><text class="node-detail" x="520" y="276.5" text-anchor="middle"><tspan x="520" dy="0">observe · render · clean up</tspan></text></g><g class="node node--kernel"><title>SignalTree causal kernel framework-neutral authority</title><rect x="200" y="360" width="640" height="140" rx="0"/><text class="node-title" x="520" y="412" text-anchor="middle"><tspan x="520" dy="0">SignalTree</tspan><tspan x="520" dy="22">causal kernel</tspan></text><text class="node-detail" x="520" y="459" text-anchor="middle"><tspan x="520" dy="0">framework-neutral authority</tspan></text></g><g class="node node--neutral"><title>state · identity · authority causal turns · operation boundaries</title><rect x="200" y="560" width="640" height="110" rx="0"/><text class="node-title" x="520" y="608" text-anchor="middle"><tspan x="520" dy="0">state · identity · authority</tspan></text><text class="node-detail" x="520" y="633" text-anchor="middle"><tspan x="520" dy="0">causal turns · operation boundaries</tspan></text></g></g><g class="edge-labels"><g class="edge-label-group"><rect class="edge-label-plate" x="463" y="142.5" width="114" height="24" rx="0"/><text class="edge-label" x="520" y="158.24" text-anchor="middle"><tspan x="520" dy="0">product intent</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="456" y="312.5" width="128" height="24" rx="0"/><text class="edge-label" x="520" y="328.24" text-anchor="middle"><tspan x="520" dy="0">writes + rereads</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="478" y="510" width="84" height="24" rx="0"/><text class="edge-label" x="520" y="525.74" text-anchor="middle"><tspan x="520" dy="0">owns</tspan></text></g></g>
</svg>
