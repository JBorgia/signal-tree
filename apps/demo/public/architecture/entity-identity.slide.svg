<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="entity-identity-slide-title entity-identity-slide-description" data-diagram="entity-identity" data-variant="slide">
  <title id="entity-identity-slide-title">Keys and positions can change without changing the subject</title>
  <desc id="entity-identity-slide-description">EntityMap separates stable subject identity from lookup key and collection position. A fresh occupant that later reuses an old key receives a different subject identity.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="entity-identity-slide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="entity-identity-slide-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1920" height="1080" fill="var(--st-surface)"/>
  <rect width="1920" height="1080" fill="url(#entity-identity-slide-grid)"/>
  <text class="slide-title" x="120" y="120">Keys and positions can change without changing the subject</text>
  <text class="slide-takeaway" x="120" y="180">A held entity facade follows SubjectId through reorder, rekey, and supported restoration.</text>
  <g transform="translate(284 315) scale(1.3)"><g><g><path class="edge" d="M 210 190 L 230 190" marker-end="url(#entity-identity-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="178" y="170" width="84" height="24" rx="0"/><text class="edge-label" x="220" y="185.74" text-anchor="middle"><tspan x="220" dy="0">reorder</tspan></text></g></g><g><path class="edge" d="M 415 190 L 435 190" marker-end="url(#entity-identity-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="381.5" y="170" width="87" height="24" rx="0"/><text class="edge-label" x="425" y="185.74" text-anchor="middle"><tspan x="425" dy="0">changeId()</tspan></text></g></g><g><path class="edge" d="M 645 190 L 665 190" marker-end="url(#entity-identity-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="588" y="170" width="134" height="24" rx="0"/><text class="edge-label" x="655" y="185.74" text-anchor="middle"><tspan x="655" dy="0">designated remove</tspan></text></g></g><g><path class="edge" d="M 855 190 L 875 190" marker-end="url(#entity-identity-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="823" y="170" width="84" height="24" rx="0"/><text class="edge-label" x="865" y="185.74" text-anchor="middle"><tspan x="865" dy="0">undo</tspan></text></g></g><g><path class="edge dashed" d="M 926.4506172839506 245 L 890.0925925925926 340" marker-end="url(#entity-identity-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="851.2716049382716" y="272.5" width="114" height="24" rx="0"/><text class="edge-label" x="908.2716049382716" y="288.24" text-anchor="middle"><tspan x="908.2716049382716" dy="0">still resolves</tspan></text></g></g></g><g><g class="node node--identity"><title>Subject S42</title><rect x="25" y="135" width="185" height="110" rx="0"/><text class="node-title" x="117.5" y="196" text-anchor="middle"><tspan x="117.5" dy="0">Subject S42</tspan></text></g><g class="node node--identity"><title>Subject S42</title><rect x="230" y="135" width="185" height="110" rx="0"/><text class="node-title" x="322.5" y="196" text-anchor="middle"><tspan x="322.5" dy="0">Subject S42</tspan></text></g><g class="node node--identity"><title>Subject S42</title><rect x="435" y="135" width="210" height="110" rx="0"/><text class="node-title" x="540" y="196" text-anchor="middle"><tspan x="540" dy="0">Subject S42</tspan></text></g><g class="node node--restoration"><title>Subject S42</title><rect x="665" y="135" width="190" height="110" rx="0"/><text class="node-title" x="760" y="196" text-anchor="middle"><tspan x="760" dy="0">Subject S42</tspan></text></g><g class="node node--identity"><title>Subject S42</title><rect x="875" y="135" width="145" height="110" rx="0"/><text class="node-title" x="947.5" y="196" text-anchor="middle"><tspan x="947.5" dy="0">Subject S42</tspan></text></g><g class="node node--kernel"><title>held facade</title><rect x="735" y="340" width="270" height="105" rx="0"/><text class="node-title" x="870" y="398.5" text-anchor="middle"><tspan x="870" dy="0">held facade</tspan></text></g></g></g>
</svg>
