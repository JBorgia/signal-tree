<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="package-ownership-slide-title package-ownership-slide-description" data-diagram="package-ownership" data-variant="slide">
  <title id="package-ownership-slide-title">Three public entry surfaces, one semantic authority</title>
  <desc id="package-ownership-slide-description">Angular and React add native observation and lifecycle integration around the same kernel types and runtime. The adapter subpath exists for realization authors, not ordinary application imports.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="package-ownership-slide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="package-ownership-slide-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1920" height="1080" fill="var(--st-surface)"/>
  <rect width="1920" height="1080" fill="url(#package-ownership-slide-grid)"/>
  <text class="slide-title" x="120" y="120">Three public entry surfaces, one semantic authority</text>
  <text class="slide-takeaway" x="120" y="180">Applications import their framework facade; framework-neutral code imports the kernel.</text>
  <g transform="translate(284 315) scale(1.3)"><g><g><path class="edge" d="M 320 130.6530612244898 L 585 192.30612244897958" marker-end="url(#package-ownership-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="378.5" y="141.4795918367347" width="148" height="24" rx="0"/><text class="edge-label" x="452.5" y="157.2195918367347" text-anchor="middle"><tspan x="452.5" dy="0">forwards + realizes</tspan></text></g></g><g><path class="edge" d="M 320 245.75510204081633 L 585 242.51020408163265" marker-end="url(#package-ownership-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="378.5" y="224.1326530612245" width="148" height="24" rx="0"/><text class="edge-label" x="452.5" y="239.8726530612245" text-anchor="middle"><tspan x="452.5" dy="0">forwards + observes</tspan></text></g></g><g><path class="edge" d="M 320 360.8571428571429 L 585 292.7142857142857" marker-end="url(#package-ownership-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="410.5" y="306.78571428571433" width="84" height="24" rx="0"/><text class="edge-label" x="452.5" y="322.52571428571434" text-anchor="middle"><tspan x="452.5" dy="0">imports</tspan></text></g></g><g><path class="edge dashed" d="M 790 385 L 790 335" marker-start="url(#package-ownership-slide-arrow)" marker-end="url(#package-ownership-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="729.5" y="340" width="121" height="24" rx="0"/><text class="edge-label" x="790" y="355.74" text-anchor="middle"><tspan x="790" dy="0">narrow contract</tspan></text></g></g></g><g><g class="node node--framework"><title>@signal-tree/angular</title><rect x="35" y="45" width="285" height="105" rx="0"/><text class="node-title" x="177.5" y="103.5" text-anchor="middle"><tspan x="177.5" dy="0">@signal-tree/angular</tspan></text></g><g class="node node--framework"><title>@signal-tree/react</title><rect x="35" y="195" width="285" height="105" rx="0"/><text class="node-title" x="177.5" y="253.5" text-anchor="middle"><tspan x="177.5" dy="0">@signal-tree/react</tspan></text></g><g class="node node--application"><title>Framework-neutral TypeScript</title><rect x="35" y="345" width="285" height="105" rx="0"/><text class="node-title" x="177.5" y="392.5" text-anchor="middle"><tspan x="177.5" dy="0">Framework-neutral</tspan><tspan x="177.5" dy="22">TypeScript</tspan></text></g><g class="node node--kernel"><title>@signal-tree/kernel</title><rect x="585" y="145" width="410" height="190" rx="0"/><text class="node-title" x="790" y="246" text-anchor="middle"><tspan x="790" dy="0">@signal-tree/kernel</tspan></text></g><g class="node node--neutral"><title>kernel/adapter</title><rect x="650" y="385" width="280" height="80" rx="0"/><text class="node-title" x="790" y="431" text-anchor="middle"><tspan x="790" dy="0">kernel/adapter</tspan></text></g></g></g>
</svg>
