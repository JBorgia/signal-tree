  <g></g><g><g class="node node--kernel"><title>Root accessor tree.$() tree.$(next) tree.$(current =&gt; next)</title><rect x="25" y="70" width="235" height="295" rx="0"/><text class="node-title" x="142.5" y="192.5" text-anchor="middle"><tspan x="142.5" dy="0">Root accessor</tspan></text><text class="node-detail node-detail--code" x="142.5" y="217.5" text-anchor="middle"><tspan x="142.5" dy="0">tree.$()</tspan><tspan x="142.5" dy="18">tree.$(next)</tspan><tspan x="142.5" dy="18">tree.$(current =&gt; next)</tspan></text></g><g class="node node--authored"><title>Branch accessor tree.$.profile() tree.$.profile(next) tree.$.profile(current =&gt; next)</title><rect x="275" y="70" width="235" height="295" rx="0"/><text class="node-title" x="392.5" y="192.5" text-anchor="middle"><tspan x="392.5" dy="0">Branch accessor</tspan></text><text class="node-detail node-detail--code" x="392.5" y="217.5" text-anchor="middle"><tspan x="392.5" dy="0">tree.$.profile()</tspan><tspan x="392.5" dy="18">tree.$.profile(next)</tspan><tspan x="392.5" dy="18">tree.$.profile(current =&gt; next)</tspan></text></g><g class="node node--framework"><title>Leaf signal tree.$.count() tree.$.count.set(5) tree.$.count.update(n =&gt; n + 1)</title><rect x="525" y="70" width="235" height="295" rx="0"/><text class="node-title" x="642.5" y="192.5" text-anchor="middle"><tspan x="642.5" dy="0">Leaf signal</tspan></text><text class="node-detail node-detail--code" x="642.5" y="217.5" text-anchor="middle"><tspan x="642.5" dy="0">tree.$.count()</tspan><tspan x="642.5" dy="18">tree.$.count.set(5)</tspan><tspan x="642.5" dy="18">tree.$.count.update(n =&gt; n + 1)</tspan></text></g><g class="node node--identity"><title>EntityMap collection rows.all() rows.setAll(next) rows.changeId(from, to)</title><rect x="775" y="70" width="240" height="295" rx="0"/><text class="node-title" x="895" y="192.5" text-anchor="middle"><tspan x="895" dy="0">EntityMap collection</tspan></text><text class="node-detail node-detail--code" x="895" y="217.5" text-anchor="middle"><tspan x="895" dy="0">rows.all()</tspan><tspan x="895" dy="18">rows.setAll(next)</tspan><tspan x="895" dy="18">rows.changeId(from, to)</tspan></text></g></g>
  <foreignObject x="24" y="473" width="992" height="264">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>tree is a controller and is not callable.</li><li>A branch call replaces a whole branch value; partial objects do not compile.</li><li>Leaf argument calls do not compile; leaves use set() and update().</li></ul></div><div><h2>Code evidence</h2><ul><li><code>packages/kernel/src/lib/callable-contract.typing.spec.ts</code></li><li><code>packages/kernel/src/lib/root-accessor-contract.typing.spec.ts</code></li><li><code>packages/kernel/src/lib/signal-tree.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
</svg>
