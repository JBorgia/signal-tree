t></g></g>
  <foreignObject x="24" y="483" width="992" height="394">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>Link keeps a state location connected to something outside. Your application still decides how to fetch, save, retry, and store that data.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>A saved cart loads from an API, sends settled edits back, and listens for stock changes. The API service owns HTTP and retry rules.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>Keeping retry and durability policy in endpoint code makes duplicate charges and lost saves easier to prevent, test, and audit.</p></div></div>
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>Link has exactly retrieve(), settled(), and dispose() on its handle.</li><li>The endpoint interface supplies optional get(), set(), and subscribe() directions.</li><li>Retry, backoff, status, codec, and transport are not kernel Link APIs.</li></ul></div><div><h2>Code evidence</h2><ul><li><code>packages/kernel/src/lib/link.ts</code></li><li><code>packages/kernel/src/lib/link-bare-contract.spec.ts</code></li><li><code>packages/kernel/src/lib/link-persistence-conformance.spec.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
</svg>
