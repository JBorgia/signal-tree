<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1040 895" role="img" aria-labelledby="link-docs-title link-docs-description" data-diagram="link" data-variant="docs">
  <title id="link-docs-title">Link owns synchronization, not backend policy</title>
  <desc id="link-docs-description">A Link can pull endpoint truth, push settled tree truth, or subscribe to live endpoint truth. Inbound values are applied as external authority. The endpoint decides storage, transport, codec, retry, cache, and scheduling policy.</desc>
