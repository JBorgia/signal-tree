<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1040 1190" role="img" aria-labelledby="causal-authority-docs-title causal-authority-docs-description" data-diagram="causal-authority" data-variant="docs">
  <title id="causal-authority-docs-title">Authority and restoration are separate axes</title>
  <desc id="causal-authority-docs-description">external() means another authority owned the decision. Transactions can group authored work and defer settlement, but they are not a third authority class.</desc>
  <style>
