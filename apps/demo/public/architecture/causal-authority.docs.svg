  <foreignObject x="24" y="778" width="992" height="394">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>SignalTree records who chose a change. Your user chose authored changes; a server or device chose external changes. Only chosen authored work belongs in undo history.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>A clerk edits an invoice note while the server sends a new tax rate. Undo reverses the note edit without pretending the clerk chose the tax rate.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>Undoing an authoritative tax, price, or payment update could produce the wrong total. Separating authority protects business truth from a user undo.</p></div></div>
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>undoable() does not make a write authored and does not create a turn boundary.</li><li>external() classifies provenance; it does not make a write invisible or consequence-free.</li><li>Transactions are grouping and settlement machinery, not authority classification.</li></ul></div><div><h2>Code evidence</h2><ul><li><code>packages/kernel/src/lib/external.ts</code></li><li><code>packages/kernel/src/lib/undoable.ts</code></li><li><code>packages/kernel/src/enhancers/transactions/transactions.ts</code></li><li><code>packages/angular/src/lib/public-surface.spec.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
</svg>
