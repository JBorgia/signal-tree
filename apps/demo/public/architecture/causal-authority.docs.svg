6.5" text-anchor="middle"><tspan x="255" dy="0">ordinary application writes</tspan><tspan x="255" dy="18">including transaction work</tspan></text></g><g class="node node--external"><title>External external(() =&gt; applyTruth()) never an authored turn</title><rect x="610" y="340" width="350" height="115" rx="0"/><text class="node-title" x="785" y="381.5" text-anchor="middle"><tspan x="785" dy="0">External</tspan></text><text class="node-detail node-detail--code" x="785" y="406.5" text-anchor="middle"><tspan x="785" dy="0">external(() =&gt; applyTruth())</tspan><tspan x="785" dy="18">never an authored turn</tspan></text></g><g class="node node--neutral"><title>Undesignated by default no restoration retention</title><rect x="25" y="510" width="295" height="80" rx="0"/><text class="node-title" x="172.5" y="532" text-anchor="middle"><tspan x="172.5" dy="0">Undesignated</tspan><tspan x="172.5" dy="22">by default</tspan></text><text class="node-detail" x="172.5" y="579" text-anchor="middle"><tspan x="172.5" dy="0">no restoration retention</tspan></text></g><g class="node node--restoration"><title>Restoration designation undoable(() =&gt; authoredWork())</title><rect x="365" y="500" width="310" height="100" rx="0"/><text class="node-title" x="520" y="532" text-anchor="middle"><tspan x="520" dy="0">Restoration</tspan><tspan x="520" dy="22">designation</tspan></text><text class="node-detail node-detail--code" x="520" y="579" text-anchor="middle"><tspan x="520" dy="0">undoable(() =&gt; authoredWork())</tspan></text></g><g class="node node--restoration"><title>Eligible for retained restoration history bounded by restoration policy</title><rect x="365" y="660" width="310" height="80" rx="0"/><text class="node-title" x="520" y="682" text-anchor="middle"><tspan x="520" dy="0">Eligible for retained</tspan><tspan x="520" dy="22">restoration history</tspan></text><text class="node-detail" x="520" y="729" text-anchor="middle"><tspan x="520" dy="0">bounded by restoration policy</tspa