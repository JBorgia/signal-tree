<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="causal-authority-slide-title causal-authority-slide-description" data-diagram="causal-authority" data-variant="slide">
  <title id="causal-authority-slide-title">Authority and restoration are separate axes</title>
  <desc id="causal-authority-slide-description">external() means another authority owned the decision. Transactions can group authored work and defer settlement, but they are not a third authority class.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes p { margin: 0; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--st-line); background: var(--st-line); gap: 1px; }
  .story-item { min-width: 0; padding: 14px 16px; background: var(--st-surface); }
  .story-item--plain { background: var(--st-authored); }
  .story-item--example { background: var(--st-framework); }
  .story-item--money { background: var(--st-restoration); }
  .story-item h2 { margin-bottom: 6px; font-size: 12px; }
  .story-item p { font-size: 14px; line-height: 1.45; }
  .slide-story { box-sizing: border-box; height: 100%; color: var(--st-ink); font: 18px/1.4 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .slide-story .story-item { padding: 16px 18px; }
  .slide-story .story-item h2 { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="causal-authority-slide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="causal-authority-slide-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1920" height="1080" fill="var(--st-surface)"/>
  <rect width="1920" height="1080" fill="url(#causal-authority-slide-grid)"/>
  <text class="slide-title" x="120" y="120">Authority and restoration are separate axes</text>
  <text class="slide-takeaway" x="120" y="180">Ordinary application writes are authored; undoable() designates authored work for restoration.</text>
  <g transform="translate(590.5263157894738 220) scale(0.7105263157894737)"><g><rect class="group-box group-box--neutral dashed" x="185" y="20" width="670" height="120" rx="0"/><text class="group-label" x="201" y="42">Orthogonal operation boundary · transaction()</text></g><g class="edge-paths"><path class="edge dashed" d="M 520 120 L 520 185" marker-end="url(#causal-authority-slide-arrow)"/><path class="edge" d="M 448.80597014925377 275 L 345.97014925373134 340" marker-end="url(#causal-authority-slide-arrow)"/><path class="edge" d="M 591.1940298507462 275 L 694.0298507462687 340" marker-end="url(#causal-authority-slide-arrow)"/><path class="edge" d="M 223.89344262295083 455 L 194.13934426229508 510" marker-end="url(#causal-authority-slide-arrow)"/><path class="edge" d="M 354.91803278688525 455 L 433.11475409836066 500" marker-end="url(#causal-authority-slide-arrow)"/><path class="edge" d="M 520 600 L 520 660" marker-end="url(#causal-authority-slide-arrow)"/></g><g class="nodes"><g class="node node--neutral"><title>operation</title><rect x="315" y="55" width="410" height="65" rx="0"/><text class="node-title" x="520" y="93.5" text-anchor="middle"><tspan x="520" dy="0">operation</tspan></text></g><g class="node node--kernel"><title>WRITE</title><rect x="365" y="185" width="310" height="90" rx="0"/><text class="node-title" x="520" y="236" text-anchor="middle"><tspan x="520" dy="0">WRITE</tspan></text></g><g class="node node--authored"><title>Authored</title><rect x="80" y="340" width="350" height="115" rx="0"/><text class="node-title" x="255" y="403.5" text-anchor="middle"><tspan x="255" dy="0">Authored</tspan></text></g><g class="node node--external"><title>External</title><rect x="610" y="340" width="350" height="115" rx="0"/><text class="node-title" x="785" y="403.5" text-anchor="middle"><tspan x="785" dy="0">External</tspan></text></g><g class="node node--neutral"><title>Undesignated by default</title><rect x="25" y="510" width="295" height="80" rx="0"/><text class="node-title" x="172.5" y="545" text-anchor="middle"><tspan x="172.5" dy="0">Undesignated</tspan><tspan x="172.5" dy="22">by default</tspan></text></g><g class="node node--restoration"><title>Restoration designation</title><rect x="365" y="500" width="310" height="100" rx="0"/><text class="node-title" x="520" y="545" text-anchor="middle"><tspan x="520" dy="0">Restoration</tspan><tspan x="520" dy="22">designation</tspan></text></g><g class="node node--restoration"><title>Eligible for retained restoration history</title><rect x="365" y="660" width="310" height="80" rx="0"/><text class="node-title" x="520" y="695" text-anchor="middle"><tspan x="520" dy="0">Eligible for retained</tspan><tspan x="520" dy="22">restoration history</tspan></text></g></g><g class="edge-labels"><g class="edge-label-group"><rect class="edge-label-plate" x="478" y="132.5" width="84" height="24" rx="0"/><text class="edge-label" x="520" y="148.24" text-anchor="middle"><tspan x="520" dy="0">groups</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="340.3880597014926" y="287.5" width="114" height="24" rx="0"/><text class="edge-label" x="397.3880597014926" y="303.24" text-anchor="middle"><tspan x="397.3880597014926" dy="0">this operation</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="575.6119402985075" y="287.5" width="134" height="24" rx="0"/><text class="edge-label" x="642.6119402985075" y="303.24" text-anchor="middle"><tspan x="642.6119402985075" dy="0">another authority</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="167.01639344262296" y="462.5" width="84" height="24" rx="0"/><text class="edge-label" x="209.01639344262296" y="478.24" text-anchor="middle"><tspan x="209.01639344262296" dy="0">ordinary</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="352.016393442623" y="457.5" width="84" height="24" rx="0"/><text class="edge-label" x="394.016393442623" y="473.24" text-anchor="middle"><tspan x="394.016393442623" dy="0">optional</tspan></text></g><g class="edge-label-group"><rect class="edge-label-plate" x="478" y="610" width="84" height="24" rx="0"/><text class="edge-label" x="520" y="625.74" text-anchor="middle"><tspan x="520" dy="0">eligible</tspan></text></g></g></g>
  <foreignObject x="120" y="790" width="1680" height="220">
    <section xmlns="http://www.w3.org/1999/xhtml" class="slide-story">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>SignalTree records who chose a change. Your user chose authored changes; a server or device chose external changes. Only chosen authored work belongs in undo history.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>A clerk edits an invoice note while the server sends a new tax rate. Undo reverses the note edit without pretending the clerk chose the tax rate.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>Undoing an authoritative tax, price, or payment update could produce the wrong total. Separating authority protects business truth from a user undo.</p></div></div>
    </section>
  </foreignObject>
</svg>
