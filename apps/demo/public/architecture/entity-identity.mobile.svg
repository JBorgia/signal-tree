<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 360 940" role="img" aria-labelledby="entity-identity-mobile-title entity-identity-mobile-description" data-diagram="entity-identity" data-variant="mobile">
  <title id="entity-identity-mobile-title">Keys and positions can change without changing the subject</title>
  <desc id="entity-identity-mobile-description">EntityMap separates stable subject identity from lookup key and collection position. A fresh occupant that later reuses an old key receives a different subject identity.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="entity-identity-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="entity-identity-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="360" height="940" fill="var(--st-surface)"/>
  <rect width="360" height="940" fill="url(#entity-identity-mobile-grid)"/>
  <g><g><path class="edge" d="M 180 125 L 180 175" marker-end="url(#entity-identity-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="138" y="130.5" width="84" height="23" rx="0"/><text class="edge-label" x="180" y="145.4" text-anchor="middle"><tspan x="180" dy="0">reorder</tspan></text></g></g><g><path class="edge" d="M 180 280 L 180 330" marker-end="url(#entity-identity-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="138" y="285.5" width="84" height="23" rx="0"/><text class="edge-label" x="180" y="300.4" text-anchor="middle"><tspan x="180" dy="0">changeId()</tspan></text></g></g><g><path class="edge" d="M 180 435 L 180 485" marker-end="url(#entity-identity-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="118" y="440.5" width="124" height="23" rx="0"/><text class="edge-label" x="180" y="455.4" text-anchor="middle"><tspan x="180" dy="0">designated remove</tspan></text></g></g><g><path class="edge" d="M 180 590 L 180 640" marker-end="url(#entity-identity-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="138" y="595.5" width="84" height="23" rx="0"/><text class="edge-label" x="180" y="610.4" text-anchor="middle"><tspan x="180" dy="0">undo</tspan></text></g></g><g><path class="edge dashed" d="M 180 745 L 180 795" marker-end="url(#entity-identity-mobile-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="127.5" y="750.5" width="105" height="23" rx="0"/><text class="edge-label" x="180" y="765.4" text-anchor="middle"><tspan x="180" dy="0">still resolves</tspan></text></g></g></g><g><g class="node node--identity"><title>Subject S42 key tmp-1 · position A</title><rect x="24" y="20" width="312" height="105" rx="0"/><text class="node-title" x="180" y="65.5" text-anchor="middle"><tspan x="180" dy="0">Subject S42</tspan></text><text class="node-detail" x="180" y="90.5" text-anchor="middle"><tspan x="180" dy="0">key tmp-1 · position A</tspan></text></g><g class="node node--identity"><title>Subject S42 key tmp-1 · position B</title><rect x="24" y="175" width="312" height="105" rx="0"/><text class="node-title" x="180" y="220.5" text-anchor="middle"><tspan x="180" dy="0">Subject S42</tspan></text><text class="node-detail" x="180" y="245.5" text-anchor="middle"><tspan x="180" dy="0">key tmp-1 · position B</tspan></text></g><g class="node node--identity"><title>Subject S42 key server-99 · position B</title><rect x="24" y="330" width="312" height="105" rx="0"/><text class="node-title" x="180" y="375.5" text-anchor="middle"><tspan x="180" dy="0">Subject S42</tspan></text><text class="node-detail" x="180" y="400.5" text-anchor="middle"><tspan x="180" dy="0">key server-99 · position B</tspan></text></g><g class="node node--restoration"><title>Subject S42 inactive · restoration-owned</title><rect x="24" y="485" width="312" height="105" rx="0"/><text class="node-title" x="180" y="530.5" text-anchor="middle"><tspan x="180" dy="0">Subject S42</tspan></text><text class="node-detail" x="180" y="555.5" text-anchor="middle"><tspan x="180" dy="0">inactive · restoration-owned</tspan></text></g><g class="node node--identity"><title>Subject S42 reactivated at exact target</title><rect x="24" y="640" width="312" height="105" rx="0"/><text class="node-title" x="180" y="685.5" text-anchor="middle"><tspan x="180" dy="0">Subject S42</tspan></text><text class="node-detail" x="180" y="710.5" text-anchor="middle"><tspan x="180" dy="0">reactivated at exact target</tspan></text></g><g class="node node--kernel"><title>held facade same logical subject</title><rect x="24" y="795" width="312" height="105" rx="0"/><text class="node-title" x="180" y="840.5" text-anchor="middle"><tspan x="180" dy="0">held facade</tspan></text><text class="node-detail" x="180" y="865.5" text-anchor="middle"><tspan x="180" dy="0">same logical subject</tspan></text></g></g>
</svg>
