<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 360 900" role="img" aria-labelledby="accessor-grammar-mobile-title accessor-grammar-mobile-description" data-diagram="accessor-grammar" data-variant="mobile">
  <title id="accessor-grammar-mobile-title">Structure is stable; leaves fit the framework</title>
  <desc id="accessor-grammar-mobile-description">The controller itself is not callable. Its root $ and branch accessors support read, whole-value replacement, and updater calls. Angular leaves are signals, Vue leaves are refs, and neutral kernel leaves are callable locations. leaf(value) makes an object or callable terminal instead of traversable. EntityMap exposes collection operations with framework-native query and field carriers. In plain words: The way you read or change state matches what you are touching: the whole tree, one object, one simple value, or a keyed collection. Real app example: A checkout replaces a complete shipping address, increments an item quantity, and looks up products by ID through their matching APIs. Why money cares: The type system catches accidental partial replacements that could erase an address field, drop an item, or calculate an order from incomplete data.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes p { margin: 0; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  .story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--st-line); background: var(--st-line); gap: 1px; }
  .story-item { min-width: 0; padding: 14px 16px; background: var(--st-surface); }
  .story-item--plain { background: var(--st-authored); }
  .story-item--example { background: var(--st-framework); }
  .story-item--money { background: var(--st-restoration); }
  .story-item h2 { margin-bottom: 6px; font-size: 12px; }
  .story-item p { font-size: 14px; line-height: 1.45; }
  .slide-story { box-sizing: border-box; height: 100%; color: var(--st-ink); font: 18px/1.4 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .slide-story .story-item { padding: 16px 18px; }
  .slide-story .story-item h2 { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="accessor-grammar-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="accessor-grammar-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="360" height="900" fill="var(--st-surface)"/>
  <rect width="360" height="900" fill="url(#accessor-grammar-mobile-grid)"/>
  <g class="edge-paths"></g><g class="nodes"><g class="node node--kernel"><title>Root accessor tree.$() tree.$(next) tree.$(current =&gt; next)</title><rect x="24" y="20" width="312" height="180" rx="0"/><text class="node-title" x="180" y="85" text-anchor="middle"><tspan x="180" dy="0">Root accessor</tspan></text><text class="node-detail node-detail--code" x="180" y="110" text-anchor="middle"><tspan x="180" dy="0">tree.$()</tspan><tspan x="180" dy="18">tree.$(next)</tspan><tspan x="180" dy="18">tree.$(current =&gt; next)</tspan></text></g><g class="node node--authored"><title>Branch accessor tree.$.profile() tree.$.profile(next) tree.$.profile(current =&gt; next)</title><rect x="24" y="230" width="312" height="195" rx="0"/><text class="node-title" x="180" y="302.5" text-anchor="middle"><tspan x="180" dy="0">Branch accessor</tspan></text><text class="node-detail node-detail--code" x="180" y="327.5" text-anchor="middle"><tspan x="180" dy="0">tree.$.profile()</tspan><tspan x="180" dy="18">tree.$.profile(next)</tspan><tspan x="180" dy="18">tree.$.profile(current =&gt; next)</tspan></text></g><g class="node node--framework"><title>Terminal leaf leaf({ start, end }) kernel: location() / location(next) Angular: signal() / .set() / .update() Vue: ref.value / ref.value = next</title><rect x="24" y="455" width="312" height="195" rx="0"/><text class="node-title" x="180" y="518.5" text-anchor="middle"><tspan x="180" dy="0">Terminal leaf</tspan></text><text class="node-detail node-detail--code" x="180" y="543.5" text-anchor="middle"><tspan x="180" dy="0">leaf({ start, end })</tspan><tspan x="180" dy="18">kernel: location() / location(next)</tspan><tspan x="180" dy="18">Angular: signal() / .set() / .update()</tspan><tspan x="180" dy="18">Vue: ref.value / ref.value = next</tspan></text></g><g class="node node--identity"><title>EntityMap collection rows.all: native readonly leaf rows.setAll(next) rows.changeId(from, to)</title><rect x="24" y="680" width="312" height="195" rx="0"/><text class="node-title" x="180" y="752.5" text-anchor="middle"><tspan x="180" dy="0">EntityMap collection</tspan></text><text class="node-detail node-detail--code" x="180" y="777.5" text-anchor="middle"><tspan x="180" dy="0">rows.all: native readonly leaf</tspan><tspan x="180" dy="18">rows.setAll(next)</tspan><tspan x="180" dy="18">rows.changeId(from, to)</tspan></text></g></g><g class="edge-labels"></g>
</svg>
