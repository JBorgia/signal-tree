  <pattern id="explanation-projection-web-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1040" height="500" fill="var(--st-surface)"/>
  <rect width="1040" height="500" fill="url(#explanation-projection-web-grid)"/>
  <g><rect class="group-box group-box--projection dashed" x="330" y="185" width="680" height="285" rx="0"/><text class="group-label" x="346" y="207">Product projection · not a public API</text></g><g class="edge-paths"><path class="edge" d="M 300.33333333333337 190 L 391 230" marker-end="url(#explanation-projection-web-arrow)"/><path class="edge" d="M 310 317.79411764705884 L 380 305.44117647058823" marker-end="url(#explanation-projection-web-arrow)"/><path class="edge" d="M 640 282.5 L 705 282.5" marker-end="url(#explanation-projection-web-arrow)"/><path class="edge" d="M 729.0094339622641 335 L 648.2547169811321 375" marker-end="url(#explanation-projection-web-arrow)"/><path class="edge" d="M 841.933962264151 335 L 847.2169811320755 375" marker-end="url(#explanation-projection-web-arrow)"/></g><g class="nodes"><g class="node node--kernel"><title>Minimal causal truth turns · participants · effects</title><rect x="30" y="75" width="280" height="115" rx="0"/><text class="node-title" x="170" y="114.5" text-anchor="middle"><tspan x="170" dy="0">Minimal</tspan><tspan x="170" dy="22">causal truth</tspan></text><text class="node-detail" x="170" y="161.5" text-anchor="middle"><tspan x="170" dy="0">turns · participants · effects</tspan></text></g><g class="node node--identity"><title>Stable identities owner · position · subject</title><rect x="30" y="285" width="280" height="115" rx="0"/><text class="node-title" x="170" y="335.5" text-anchor="middle"><tspan x="170" dy="0">Stable identities</tspan></text><text class="node-detail" x="170" y="360.5" text-anchor="middle"><tspan x="170" dy="0">owner · position · subject</tspan></text></g><g class="node node--application"><title>Application context domain metadata · user intent</title><rect x="380" y="230" width="260" height="105" rx="0"/><text class="node-title" x="510" y="275.5" text-anchor="middle"><tspan x="510" dy="0">Application context</tspan></text><text class="node-detail" x="510" y="300.5" text-anchor="middle"><tspan x="510" dy="0">domain metadata · user intent</tspan></text></g><g class="node node--projection"><title>Projection interprets; never becomes authority</title><rect x="705" y="230" width="260" height="105" rx="0"/><text class="node-title" x="835" y="275.5" text-anchor="middle"><tspan x="835" dy="0">Projection</tspan></text><text class="node-detail" x="835" y="300.5" text-anchor="middle"><tspan x="835" dy="0">interprets; never becomes authority</tspan></text></g><g class="node node--authored"><title>Human explanation product-facing narrative</title><rect x="450" y="375" width="235" height="80" rx="0"/><text class="node-title" x="567.5" y="397" text-anchor="middle"><tspan x="567.5" dy="0">Human</tspan><tspan x="567.5" dy="22">explanation</tspan></text><text class="node-detail" x="567.5" y="444" text-anchor="middle"><tspan x="567.5" dy="0">product-facing narrative</tspan></text></g><g class="node node--external"><title>AI explanation same facts · different projection</title><rect x="735" y="375" width="235" height="80" rx="0"/><text class="node-title" x="852.5" y="397" text-anchor="middle"><tspan x="852.5" dy="0">AI</tspan><tspan x="852.5" dy="22">explanation</tspan></text><text class="node-detail" x="852.5" y="444" text-anchor="middle"><tspan x="852.5" dy="0">same facts · different projection</tspan></text></g></g><g class="edge-labels"></g>
