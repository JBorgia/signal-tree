<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="system-boundary-slide-title system-boundary-slide-description" data-diagram="system-boundary" data-variant="slide">
  <title id="system-boundary-slide-title">SignalTree in one picture</title>
  <desc id="system-boundary-slide-description">Application policy chooses the work. Angular and React connect that work to their observation runtimes. The framework-neutral kernel owns the state and causal model beneath both.</desc>
  <style>
  :root {
    --st-ink: #17211a;
    --st-muted: #55615a;
    --st-surface: #fbfcf8;
    --st-grid: rgba(23, 33, 26, 0.055);
    --st-line: #526158;
    --st-application: #fff0c7;
    --st-framework: #dbe8ff;
    --st-kernel: #d9f66f;
    --st-authored: #d9f0df;
    --st-external: #ffe0d5;
    --st-restoration: #f8d66d;
    --st-identity: #d6eee9;
    --st-projection: #e9e0f7;
    --st-neutral: #edf0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --st-ink: #eef4e9;
      --st-muted: #b6c1b8;
      --st-surface: #17211a;
      --st-grid: rgba(238, 244, 233, 0.055);
      --st-line: #a9b6ac;
      --st-application: #544a2d;
      --st-framework: #30435f;
      --st-kernel: #4c641f;
      --st-authored: #31513a;
      --st-external: #653f35;
      --st-restoration: #624f1e;
      --st-identity: #31534c;
      --st-projection: #493d5c;
      --st-neutral: #303a33;
    }
  }
  text { fill: var(--st-ink); }
  .group-box { fill: color-mix(in srgb, var(--st-neutral) 55%, transparent); stroke: var(--st-line); stroke-width: 1.5; }
  .group-box--projection { fill: color-mix(in srgb, var(--st-projection) 42%, transparent); }
  .dashed { stroke-dasharray: 8 7; }
  .group-label, .node-detail { fill: var(--st-muted); }
  .group-label, .node-title, .edge-label { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; }
  .group-label { font-size: 12px; font-weight: 700; }
  .edge { fill: none; stroke: var(--st-line); stroke-width: 2; }
  .edge-label-group { pointer-events: none; }
  .edge-label-plate { fill: var(--st-surface); stroke: color-mix(in srgb, var(--st-line) 42%, transparent); stroke-width: 1; }
  .edge-label { fill: var(--st-ink); font-size: 11px; font-weight: 700; }
  .node { outline: none; }
  .node rect { stroke: color-mix(in srgb, var(--st-ink) 42%, transparent); stroke-width: 1.4; transition: stroke-width 180ms ease; }
  .node:hover rect { stroke-width: 2.5; }
  .node--application rect { fill: var(--st-application); }
  .node--framework rect { fill: var(--st-framework); }
  .node--kernel rect { fill: var(--st-kernel); }
  .node--authored rect { fill: var(--st-authored); }
  .node--external rect { fill: var(--st-external); }
  .node--restoration rect { fill: var(--st-restoration); }
  .node--identity rect { fill: var(--st-identity); }
  .node--projection rect { fill: var(--st-projection); }
  .node--neutral rect { fill: var(--st-neutral); }
  .node-title { font-size: 16px; font-weight: 730; }
  .node-detail { font-family: 'IBM Plex Sans', 'Avenir Next', sans-serif; font-size: 12px; font-weight: 520; }
  .node-detail--code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-size: 10.5px; }
  .slide-title { font: 700 62px 'Space Grotesk', 'Avenir Next', sans-serif; }
  .slide-takeaway { fill: var(--st-muted); font: 500 28px 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes { box-sizing: border-box; height: 100%; padding: 22px 28px; color: var(--st-ink); border: 1px solid var(--st-line); background: var(--st-neutral); font: 15px/1.5 'IBM Plex Sans', 'Avenir Next', sans-serif; }
  .notes-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; }
  .notes h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes code { font-size: 13px; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .node rect { transition: none; } }
</style>
  <defs>
  <marker id="system-boundary-slide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--st-line)"/></marker>
  <pattern id="system-boundary-slide-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--st-grid)" stroke-width="1"/></pattern>
</defs>
  <rect width="1920" height="1080" fill="var(--st-surface)"/>
  <rect width="1920" height="1080" fill="url(#system-boundary-slide-grid)"/>
  <text class="slide-title" x="120" y="120">SignalTree in one picture</text>
  <text class="slide-takeaway" x="120" y="180">Frameworks realize canonical truth; the kernel remains the state authority.</text>
  <g transform="translate(173.95348837209303 315) scale(1.5116279069767442)"><g><g><path class="edge" d="M 250 195 L 310 195" marker-end="url(#system-boundary-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="223" y="175" width="114" height="24" rx="0"/><text class="edge-label" x="280" y="190.74" text-anchor="middle"><tspan x="280" dy="0">product intent</tspan></text></g></g><g><path class="edge" d="M 550 195 L 610 195" marker-end="url(#system-boundary-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="516" y="175" width="128" height="24" rx="0"/><text class="edge-label" x="580" y="190.74" text-anchor="middle"><tspan x="580" dy="0">writes + rereads</tspan></text></g></g><g><path class="edge" d="M 800 285 L 800 325" marker-end="url(#system-boundary-slide-arrow)"/><g class="edge-label-group"><rect class="edge-label-plate" x="758" y="285" width="84" height="24" rx="0"/><text class="edge-label" x="800" y="300.74" text-anchor="middle"><tspan x="800" dy="0">owns</tspan></text></g></g></g><g><g class="node node--application"><title>Application policy</title><rect x="40" y="140" width="210" height="110" rx="0"/><text class="node-title" x="145" y="201" text-anchor="middle"><tspan x="145" dy="0">Application policy</tspan></text></g><g class="node node--framework"><title>Angular / React realization</title><rect x="310" y="125" width="240" height="140" rx="0"/><text class="node-title" x="430" y="190" text-anchor="middle"><tspan x="430" dy="0">Angular / React</tspan><tspan x="430" dy="22">realization</tspan></text></g><g class="node node--kernel"><title>SignalTree causal kernel</title><rect x="610" y="105" width="380" height="180" rx="0"/><text class="node-title" x="800" y="190" text-anchor="middle"><tspan x="800" dy="0">SignalTree</tspan><tspan x="800" dy="22">causal kernel</tspan></text></g><g class="node node--neutral"><title>state · identity · authority</title><rect x="650" y="325" width="300" height="75" rx="0"/><text class="node-title" x="800" y="368.5" text-anchor="middle"><tspan x="800" dy="0">state · identity · authority</tspan></text></g></g></g>
</svg>
