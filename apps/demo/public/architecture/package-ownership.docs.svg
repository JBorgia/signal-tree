  <foreignObject x="24" y="518" width="992" height="264">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>The current package set is kernel, Angular, and React; v15 is not a single-package release.</li><li>Framework packages do not create independent state authority.</li><li>Bounded owners release resources with destroy(); Angular defineStore binds that to DestroyRef.</li></ul></div><div><h2>Code evidence</h2><ul><li><code>scripts/release-plan.mjs</code></li><li><code>packages/kernel/src/adapter.ts</code></li><li><code>packages/angular/src/lib/define-store.ts</code></li><li><code>packages/react/src/use-signal-tree.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
