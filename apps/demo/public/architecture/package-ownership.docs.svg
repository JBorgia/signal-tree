  <foreignObject x="24" y="518" width="992" height="394">
    <section xmlns="http://www.w3.org/1999/xhtml" class="notes">
      <div class="story-grid"><div class="story-item story-item--plain"><h2>In plain words</h2><p>Choose the package that matches your app. It includes the shared SignalTree engine plus the connection your framework needs.</p></div><div class="story-item story-item--example"><h2>Real app example</h2><p>An Angular checkout imports @signal-tree/angular, a Vue dispatch screen imports @signal-tree/vue, and a framework-free pricing library imports @signal-tree/kernel.</p></div><div class="story-item story-item--money"><h2>Why money cares</h2><p>One import path avoids duplicate integration code and competing state copies, reducing maintenance work and costly checkout defects.</p></div></div>
      <div class="notes-grid"><div><h2>Semantic checks</h2><ul><li>The current package set is kernel, Angular, React, and Vue.</li><li>Framework packages do not create independent state authority.</li><li>Bounded owners release resources with destroy(); Angular defineStore binds that to DestroyRef.</li></ul></div><div><h2>Code evidence</h2><ul><li><code>scripts/release-plan.mjs</code></li><li><code>packages/kernel/src/adapter.ts</code></li><li><code>packages/angular/src/lib/define-store.ts</code></li><li><code>packages/react/src/use-signal-tree.ts</code></li><li><code>packages/vue/src/lib/vue-observation.ts</code></li></ul></div></div>
    </section>
  </foreignObject>
</svg>
