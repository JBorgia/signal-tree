<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1040 800" role="img" aria-labelledby="package-ownership-docs-title package-ownership-docs-description" data-diagram="package-ownership" data-variant="docs">
  <title id="package-ownership-docs-title">Three public entry surfaces, one semantic authority</title>
  <desc id="package-ownership-docs-description">Angular and React add native observation and lifecycle integration around the same kernel types and runtime. The adapter subpath exists for realization authors, not ordinary application imports.</desc>
  <style>
