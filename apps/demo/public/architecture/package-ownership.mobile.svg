@signal-tree/</tspan><tspan x="94" dy="22">angular</tspan></text><text class="node-detail node-detail--code" x="94" y="92.5" text-anchor="middle"><tspan x="94" dy="0">Angular signals</tspan><tspan x="94" dy="18">DI · DestroyRef</tspan></text></g><g class="node node--framework"><title>@signal-tree/ react useSignalTree (owner, selector)</title><rect x="184" y="20" width="164" height="105" rx="0"/><text class="node-title" x="266" y="45.5" text-anchor="middle"><tspan x="266" dy="0">@signal-tree/</tspan><tspan x="266" dy="22">react</tspan></text><text class="node-detail node-detail--code" x="266" y="92.5" text-anchor="middle"><tspan x="266" dy="0">useSignalTree</tspan><tspan x="266" dy="18">(owner, selector)</tspan></text></g><g class="node node--application"><title>Framework-neutral TypeScript no realization runtime</title><rect x="12" y="410" width="164" height="105" rx="0"/><text class="node-title" x="94" y="444.5" text-anchor="middle"><tspan x="94" dy="0">Framework-neutral</tspan><tspan x="94" dy="22">TypeScript</tspan></text><text class="node-detail" x="94" y="491.5" text-anchor="middle"><tspan x="94" dy="0">no realization runtime</tspan></text></g><g class="node node--kernel"><title>@signal-tree/kernel state · identity · causal turns Link · restoration · invalidation</title><rect x="24" y="195" width="312" height="140" rx="0"/><text class="node-title" x="180" y="249" text-anchor="middle"><tspan x="180" dy="0">@signal-tree/kernel</tspan></text><text class="node-detail node-detail--code" x="180" y="274" text-anchor="middle"><tspan x="180" dy="0">state · identity · causal turns</tspan><tspan x="180" dy="18">Link · restoration · invalidation</tspan></text></g><g class="node node--neutral"><title>kernel/adapter realization SDK</title><rect x="184" y="410" width="164" height="80" rx="0"/><text class="node-title" x="266" y="443" text-anchor="middle"><tspan x="266" dy="0">kernel/adapter</tspan></text><text class="node-detail node-detail--code" x="266" y="468" text-anchor="